name: Sync Project Priority Field

on:
  issues:
    types: [labeled, unlabeled, opened]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync priority label → Project Priority field
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python3 - <<'PYEOF'
          import os, subprocess, json, sys

          PROJECT_OWNER = "kazu098"
          PROJECT_NUMBER = 1
          FIELD_NAME = "Priority"
          LABEL_TO_OPT = {"priority:p0": "P0", "priority:p1": "P1", "priority:p2": "P2"}

          issue_number = int(os.environ.get("ISSUE_NUMBER", "0"))
          if issue_number == 0:
              print("ISSUE_NUMBER not set, skipping")
              sys.exit(0)

          def gql(query):
              r = subprocess.run(
                  ["gh", "api", "graphql", "-f", f"query={query}"],
                  capture_output=True, text=True
              )
              r.raise_for_status()
              return json.loads(r.stdout)

          # Issue のラベルを取得
          data = gql(f"""
          query {{
            repository(owner: "{PROJECT_OWNER}", name: "personal-ops") {{
              issue(number: {issue_number}) {{
                labels(first: 20) {{ nodes {{ name }} }}
                projectItems(first: 10) {{
                  nodes {{
                    id
                    project {{ number }}
                  }}
                }}
              }}
            }}
          }}""")

          issue = data["data"]["repository"]["issue"]
          labels = [l["name"] for l in issue["labels"]["nodes"]]

          # priority ラベルを特定
          priority_label = next((l for l in labels if l.startswith("priority:")), None)
          if not priority_label:
              print(f"No priority label found on issue #{issue_number}, skipping")
              sys.exit(0)

          target_opt_name = LABEL_TO_OPT.get(priority_label)
          if not target_opt_name:
              sys.exit(0)

          # プロジェクトのアイテムIDとフィールドIDを取得
          item_nodes = [n for n in issue["projectItems"]["nodes"] if n["project"]["number"] == PROJECT_NUMBER]
          if not item_nodes:
              print(f"Issue #{issue_number} not in project {PROJECT_NUMBER}, skipping")
              sys.exit(0)

          item_id = item_nodes[0]["id"]

          # Priority フィールドのオプションIDを取得
          proj_data = gql(f"""
          query {{
            user(login: "{PROJECT_OWNER}") {{
              projectV2(number: {PROJECT_NUMBER}) {{
                id
                fields(first: 20) {{
                  nodes {{
                    ... on ProjectV2SingleSelectField {{
                      id name
                      options {{ id name }}
                    }}
                  }}
                }}
              }}
            }}
          }}""")

          project_id = proj_data["data"]["user"]["projectV2"]["id"]
          fields = proj_data["data"]["user"]["projectV2"]["fields"]["nodes"]
          priority_field = next((f for f in fields if f.get("name") == FIELD_NAME), None)
          if not priority_field:
              print(f"Field '{FIELD_NAME}' not found in project")
              sys.exit(1)

          field_id = priority_field["id"]
          opt = next((o for o in priority_field["options"] if o["name"] == target_opt_name), None)
          if not opt:
              print(f"Option '{target_opt_name}' not found")
              sys.exit(1)

          # フィールド値を更新
          gql(f"""
          mutation {{
            updateProjectV2ItemFieldValue(input: {{
              projectId: "{project_id}"
              itemId: "{item_id}"
              fieldId: "{field_id}"
              value: {{ singleSelectOptionId: "{opt['id']}" }}
            }}) {{ projectV2Item {{ id }} }}
          }}""")

          print(f"✅ Issue #{issue_number}: Priority → {target_opt_name}")
          PYEOF
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
