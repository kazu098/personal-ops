name: Evening Canvas to Notion Sync

on:
  schedule:
    # 毎晩 21:00 JST (= 12:00 UTC)
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Sync Canvas checked items to Notion Done
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          DAILY_CANVAS_ID: ${{ vars.DAILY_CANVAS_ID }}
        run: python scripts/sync_canvas_to_notion.py
